services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: true 
    ControleOnline\:
        resource: '../../src/*'
        exclude: '../../src/{DependencyInjection,Entity,Resource,Migrations,Library,Message,Tests,Kernel.php}'
    ControleOnline\Repository\:
        resource: '../../src/Repository'
        tags: ['doctrine.repository_service']
    ControleOnline\Controller\:
        resource: '../../src/Controller'
        tags: ['controller.service_arguments']
    ControleOnline\Command\:
        resource: '../../src/Command'
        tags: ['console.command']
    ControleOnline\Filter\:
        resource: '../../src/Filter'    
    ControleOnline\Service\Imports\ProductImportService:
        tags:
            - app.import_processor

    ControleOnline\Listener\ProductCatalogWriteListener:
        tags:
            - { name: doctrine.event_listener, event: onFlush }

    ControleOnline\Metadata\ProductCatalogResourceMetadataFactory:
        decorates: 'api_platform.metadata.resource.metadata_collection_factory'
        arguments:
            $inner: '@ControleOnline\Metadata\ProductCatalogResourceMetadataFactory.inner'
